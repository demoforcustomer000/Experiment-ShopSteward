  /* ── KPI 2: Filterable Period Sales ── */
  function calcPeriodSales(period) {
    const today = new Date();
    let startDate = new Date();
    
    if (period === 'week') {
      const day = today.getDay() || 7; 
      startDate.setDate(today.getDate() - day + 1); // Monday
    } else if (period === 'month') {
      startDate = new Date(today.getFullYear(), today.getMonth(), 1);
    } else if (period === 'quarter') {
      const quarter = Math.floor(today.getMonth() / 3);
      startDate = new Date(today.getFullYear(), quarter * 3, 1);
    } else if (period === 'year') {
      startDate = new Date(today.getFullYear(), 0, 1);
    }
    
    const startStr = startDate.toISOString().slice(0, 10);
    const endStr = today.toISOString().slice(0, 10);

    let total = 0;
    let count = 0;
    
    DB.invoices.forEach(inv => {
      const d = txDate(inv, 'invoice_date');
      if (d >= startStr && d <= endStr && !String(inv.invoice_no).startsWith(RETURN_PREFIX)) {
        total += Number(inv.total || 0);
        count++;
      }
    });

    const valEl = document.getElementById('period-sales-val');
    const countEl = document.getElementById('period-inv-count');
    if (valEl) valEl.textContent = rs(total);
    if (countEl) countEl.textContent = `${count} Invoice${count === 1 ? '' : 's'}`;
  }

  // Initialize and wire up the dropdown
  const periodFilter = document.getElementById('period-filter');
  if (periodFilter) {
    calcPeriodSales(periodFilter.value);
    periodFilter.addEventListener('change', (e) => calcPeriodSales(e.target.value));
  }

    /* ── KPI 4: Today's Doctors Logic ── */
  const weekDaysMap = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const todayIndex = new Date().getDay();
  const todayDayName = weekDaysMap[todayIndex];

  // Find all doctors who visit today
  const todaysDoctors = DB.doctors.filter(doc => 
    doc.visiting_days && doc.visiting_days.includes(todayDayName)
  );

  const namesEl = document.getElementById('kpi-doc-names');
  const subEl = document.getElementById('kpi-doc-sub');
  const cardEl = document.getElementById('kpi-doc-card');

  if (todaysDoctors.length === 0) {
    namesEl.textContent = "No doctor today";
    subEl.textContent = "Have a relaxing day!";
    cardEl.style.cursor = "default";
  } else {
    // Join names with a comma
    namesEl.innerHTML = todaysDoctors.map(d => `<b>${esc(d.name)}</b>`).join(', ');
    subEl.textContent = `👨‍⚕️ ${todaysDoctors.length} Doctor${todaysDoctors.length === 1 ? '' : 's'} visiting today`;

    // Add click event to open a modal with the full list
    cardEl.onclick = () => {
      openModal(`
        <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">Doctors Visiting Today (${todayDayName})</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${todaysDoctors.map(d => `
            <div style="padding:12px;border:1px solid var(--border);border-radius:10px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:700;font-size:14px;color:var(--text)">${esc(d.name)}</div>
                ${d.hospital ? `<div style="font-size:12px;color:var(--text-2);margin-top:2px">${esc(d.hospital)}</div>` : ''}
              </div>
              ${d.phone ? `<a href="tel:${esc(d.phone)}" class="btn btn-ghost btn-sm">📞 Call</a>` : ''}
            </div>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:16px">
          <button class="btn btn-primary" onclick="closeModal()">Close</button>
        </div>
      `);
    };
  }
}

          <option value="due">Due (low first)</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <label class="label">&nbsp;</label>
        <select class="input" id="c-filter">
          <option value="">All</option>
          <option value="due">Only with due</option>
          <option value="nodue">Only cleared</option>
        </select>
      </div>
    </div>

    <div class="card card-flat" style="padding:0;background:transparent;border:0;box-shadow:none">
      <div class="tbl-wrap responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Joined</th>
              <th style="text-align:right">Due</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="c-body"></tbody>
        </table>
      </div>
      <div class="mobile-list" id="c-mobile"></div>
    </div>
  `;

  function filtered(){
    const q      = ($('#c-search').value || '').toLowerCase().trim();
    const sortBy = $('#c-sort').value;
    const flt    = $('#c-filter').value;

    let arr = list
      .map(c => ({ ...c, _stats: customerStats(c.id) }))
      .filter(c => {
        if(q && !((c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q))) return false;
        if(flt === 'due'   && !(c._stats.due > 0)) return false;
        if(flt === 'nodue' && c._stats.due > 0) return false;
        return true;
      });

    if(sortBy === 'name')           arr.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    else if(sortBy === 'name-desc') arr.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
    else if(sortBy === 'due-desc')  arr.sort((a, b) => b._stats.due - a._stats.due);
    else if(sortBy === 'due')       arr.sort((a, b) => a._stats.due - b._stats.due);
    return arr;
  }

  function renderTable(){
    const arr = filtered();

    /* Desktop table */
    const tbody = $('#c-body');
    if(tbody){
      tbody.innerHTML = arr.length === 0
        ? `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-2)">No customers match</td></tr>`
        : arr.map(c => {
            const st = c._stats;
            return `<tr>
              <td><a href="#/customer/${c.id}" style="font-weight:600">${esc(c.name)}</a></td>
              <td>${c.phone ? `<a href="tel:${esc(c.phone)}" style="color:var(--text-2)">${esc(c.phone)}</a>` : '—'}</td>
              <td style="color:var(--text-2)">${fmtDate(c.joined_date)}</td>
              <td style="text-align:right;font-weight:600;color:${st.due > 0 ? 'var(--red)' : 'var(--text-2)'}">${rs(st.due)}</td>
              <td style="text-align:right;white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-view="${c.id}">View</button>
                <button class="btn btn-ghost btn-sm" data-del="${c.id}" style="color:var(--red)">Del</button>
              </td>
            </tr>`;
          }).join('');
    }

    /* Mobile list */
    const mob = $('#c-mobile');
    if(mob){
      mob.innerHTML = arr.length === 0
        ? `<div class="empty" style="padding:30px 10px"><div class="empty-icon">👥</div><h3>No customers match</h3></div>`
        : arr.map(c => {
            const st = c._stats;
            const init = (c.name || 'C').charAt(0).toUpperCase();
            return `
              <a href="#/customer/${c.id}" class="list-row">
                <div class="list-avatar">${esc(init)}</div>
                <div class="list-body">
                  <div class="name">${esc(c.name)}</div>
                  <div class="sub">
                    ${c.phone ? `<span>${esc(c.phone)}</span>` : '<span>No phone</span>'}
                    <span>·</span>
                    <span>${fmtDate(c.joined_date)}</span>
                  </div>
                </div>
                <div class="list-amount">
                  <div class="amt" style="color:${st.due > 0 ? 'var(--red)' : 'var(--text-2)'}">${rs(st.due)}</div>
                  <div class="tag">${st.due > 0 ? 'Due' : 'Clear'}</div>
                </div>
              </a>`;
          }).join('');
    }

    /* Wire buttons */
    $$('[data-view]').forEach(b => b.onclick = () => location.hash = '#/customer/' + b.dataset.view);

    $$('[data-del]').forEach(b => b.onclick = async () => {
      const c = DB.customers.find(x => x.id === b.dataset.del);
      if(!c) return;
      const invCount = DB.invoices.filter(i => i.customer_id === c.id).length;
      const payCount = DB.payments.filter(p => p.customer_id === c.id).length;
      const warn = (invCount || payCount)
        ? `Delete customer "${c.name}"?\n\n⚠️ Their ${invCount} invoice(s) and ${payCount} payment(s) will remain in the system but won't be linked to any customer.\n\nContinue?`
        : `Delete customer "${c.name}"?`;
      if(!confirmDlg(warn, 'Confirm Delete')) return;

      const { error } = await sb.from('customers').delete().eq('id', c.id);
      if(error){ toast(error.message, 'error'); return; }
      await syncDB();
      toast('Customer deleted', 'success');
      renderTable();
    });
  }

  ['c-search', 'c-sort', 'c-filter'].forEach(id => {
    const el = $('#' + id);
    if(el){ el.oninput = renderTable; el.onchange = renderTable; }
  });

  renderTable();
  $('#add-cust').onclick = () => openCustomerForm();
}

/* ─────────────────────────────────────────────
   2. CUSTOMER FORM (add / edit)
   ───────────────────────────────────────────── */
function openCustomerForm(existing){
  const c = existing || {
    name: '', phone: '', address: '', notes: '',
    joined_date: todayStr(), tx_time: ''
  };

  openModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">${existing ? 'Edit' : 'New'} Customer</h2>
    <form id="cf" style="display:flex;flex-direction:column;gap:12px">
      <div><label class="label">Name *</label>
        <input class="input" name="name" required value="${esc(c.name || '')}" autofocus></div>
      <div><label class="label">Phone</label>
        <input class="input" type="tel" name="phone" value="${esc(c.phone || '')}" placeholder="10-digit mobile"></div>
      <div><label class="label">Address</label>
        <input class="input" name="address" value="${esc(c.address || '')}"></div>
      <div><label class="label">Notes</label>
        <input class="input" name="notes" value="${esc(c.notes || '')}" placeholder="Allergies, regular customer, etc."></div>
      ${dateTimeFieldHTML(c.joined_date || todayStr(), c.tx_time || '', 'Joined')}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="cf-save">${existing ? 'Update' : 'Save'}</button>
      </div>
    </form>
  `, root => {
    root.querySelector('#cf').onsubmit = async e => {
      e.preventDefault();
      const dt = readDateTime(e.target);
      if(!dt) return;
      const fd = new FormData(e.target);
      const data = {
        name:        (fd.get('name') || '').trim(),
        phone:       (fd.get('phone') || '').trim(),
        address:     (fd.get('address') || '').trim(),
        notes:       (fd.get('notes') || '').trim(),
        joined_date: dt.date,
        tx_time:     dt.time
      };
      if(!data.name){ toast('Name is required', 'error'); return; }

      const btn = root.querySelector('#cf-save');
      btn.disabled = true; btn.textContent = 'Saving...';

      let res;
      if(existing) res = await sb.from('customers').update(data).eq('id', existing.id).select().single();
      else         res = await sb.from('customers').insert(data).select().single();

      if(res.error){
        toast(res.error.message, 'error');
        btn.disabled = false; btn.textContent = existing ? 'Update' : 'Save';
        return;
      }
      await syncDB();
      toast(existing ? 'Updated' : 'Customer added', 'success');
      closeModal(root);
      route();
    };
  });
}

/* ─────────────────────────────────────────────
   5. CUSTOMER WHATSAPP — full statement text
   ───────────────────────────────────────────── */
function openCustomerWhatsApp(c, st, invs, pays){
  if(!c.phone){ toast('No phone number saved', 'error'); return; }

  const shopName    = SETTINGS.shop_name || 'MediStore';
  const shopPhone   = SETTINGS.phone ? 'Ph: ' + SETTINGS.phone : '';
  const shopAddress = SETTINGS.address || '';

  let msg = '';
  msg += '*' + shopName + '*\n';
  if(shopAddress) msg += shopAddress + '\n';
  if(shopPhone)   msg += shopPhone + '\n';
  msg += '\n';
  msg += 'Hello *' + (c.name || 'Customer') + '*,\n\n';
  msg += 'Thank you for being our customer. Here is your account summary:\n\n';

  /* ── Summary block ── */
  msg += '*── Account Summary ──*\n';
  msg += 'Total billed: ' + rs(st.total_bought) + '\n';
  msg += 'Total paid:   ' + rs(st.total_paid) + '\n';
  msg += '*Balance due: ' + rs(st.due) + '*\n\n';

  /* ── Recent invoices ── */
  if(invs.length){
    msg += '*── Recent Invoices ──*\n';
    invs.slice(0, 5).forEach((i, idx) => {
      msg += (idx + 1) + '. ' + (i.invoice_no || '') + ' · ' + fmtDate(txDate(i, 'invoice_date')) + '\n';
      msg += '   ' + rs(i.total) + (Number(i.due) > 0 ? ' (Due ' + rs(i.due) + ')' : ' (Paid)') + '\n';
    });
    if(invs.length > 5) msg += '   ...and ' + (invs.length - 5) + ' more\n';
    msg += '\n';
  }

  /* ── Recent payments ── */
  if(pays.length){
    msg += '*── Recent Payments ──*\n';
    pays.slice(0, 3).forEach(p => {
      msg += '• ' + fmtDate(txDate(p, 'payment_date')) + ' — ' + rs(p.amount) + ' (' + (p.mode || 'cash') + ')\n';
    });
    msg += '\n';
  }

  msg += 'For any query, call us at ' + (SETTINGS.phone || '') + '.\n';
  msg += '\n— ' + shopName;

  const url = waLink(c.phone, msg);
  window.open(url, '_blank');
}

              </td>
            </tr>`;
          }).join('');
    }

    const mob = $('#d-mobile');
    if(mob){
      mob.innerHTML = arr.length === 0
        ? `<div class="empty" style="padding:30px 10px"><div class="empty-icon">🩺</div><h3>No doctors match</h3></div>`
        : arr.map(d => {
            const init = (d.name || 'D').charAt(0).toUpperCase();
            const invCount = DB.invoices.filter(i => i.doctor_id === d.id).length;
            return `
              <a href="#/doctor/${d.id}" class="list-row">

                  <div class="name">${esc(d.name)}</div>

                    ${d.hospital ? esc(d.hospital) + ' · ' : ''}${d.phone ? esc(d.phone) : 'No phone'}

                </div>
                <div class="list-amount">
                  <div class="amt">${invCount}</div>
                  <div class="tag">Rx</div>
                </div>
              </a>`;
          }).join('');
    }

    $$('[data-view]').forEach(b => b.onclick = () => location.hash = '#/doctor/' + b.dataset.view);

    $$('[data-del]').forEach(b => b.onclick = async () => {
      const d = DB.doctors.find(x => x.id === b.dataset.del);
      if(!d) return;
      const invCount = DB.invoices.filter(i => i.doctor_id === d.id).length;
      const warn = invCount
        ? `Delete doctor "${d.name}"?\n\n⚠️ ${invCount} invoice(s) will keep the doctor name snapshot but lose the link.`
        : `Delete doctor "${d.name}"?`;
      if(!confirmDlg(warn, 'Confirm Delete')) return;

      const { error } = await sb.from('doctors').delete().eq('id', d.id);
      if(error){ toast(error.message, 'error'); return; }
      await syncDB();
      toast('Doctor deleted', 'success');
      renderTable();
    });
  }

  const s = $('#d-search');
  if(s) s.oninput = renderTable;

  renderTable();
  $('#add-doc').onclick = () => openDoctorForm();
}

function openDoctorForm(existing){
  const d = existing || { name: '', hospital: '', phone: '', notes: '', visiting_days: [] };
  
  // Ensure visiting_days is an array
  const selectedDays = d.visiting_days || [];
  const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  
  // Generate the checkboxes
  const daysHTML = weekDays.map(day => `
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;background:#f8fafc;padding:8px;border-radius:8px;border:1px solid var(--border)">
      <input type="checkbox" name="visiting_days" value="${day}" ${selectedDays.includes(day) ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--teal-600)">
      ${day}
    </label>
  `).join('');

  openModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">${existing ? 'Edit' : 'New'} Doctor</h2>
    <form id="df" style="display:flex;flex-direction:column;gap:12px">
      <div><label class="label">Doctor Name *</label>
        <input class="input" name="name" required value="${esc(d.name || '')}" placeholder="Dr. ..." autofocus></div>
      <div><label class="label">Hospital / Clinic</label>
        <input class="input" name="hospital" value="${esc(d.hospital || '')}"></div>
      <div><label class="label">Phone</label>
        <input class="input" type="tel" name="phone" value="${esc(d.phone || '')}"></div>
      
      <!-- NEW: Visiting Days -->
      <div>
        <label class="label">Visiting Days (Which days does this doctor visit?)</label>
        <div class="grid-4" style="gap:8px;margin-top:6px">
          ${daysHTML}
        </div>
      </div>

      <div><label class="label">Notes</label>
        <input class="input" name="notes" value="${esc(d.notes || '')}" placeholder="Speciality, area, etc."></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="df-save">${existing ? 'Update' : 'Save'}</button>
      </div>
    </form>
  `, root => {
    root.querySelector('#df').onsubmit = async e => {
      e.preventDefault();
      
      // Collect checked days
      const checkedDays = [...e.target.querySelectorAll('input[name="visiting_days"]:checked')].map(cb => cb.value);
      
      const fd = new FormData(e.target);
      const data = {
        name:     (fd.get('name') || '').trim(),
        hospital: (fd.get('hospital') || '').trim(),
        phone:    (fd.get('phone') || '').trim(),
        notes:    (fd.get('notes') || '').trim(),
        visiting_days: checkedDays
      };
      if(!data.name){ toast('Doctor name is required', 'error'); return; }

      const btn = root.querySelector('#df-save');
      btn.disabled = true; btn.textContent = 'Saving...';

      let res;
      if(existing) res = await sb.from('doctors').update(data).eq('id', existing.id).select().single();
      else         res = await sb.from('doctors').insert(data).select().single();

      if(res.error){
        toast(res.error.message, 'error');
        btn.disabled = false; btn.textContent = existing ? 'Update' : 'Save';
        return;
      }
      await syncDB();
      toast(existing ? 'Updated' : 'Doctor added', 'success');
      closeModal(root);
      route();
    };
  });
}

/* ─────────────────────────────────────────────
   1. VENDOR LIST (shared by Companies & Suppliers)

function renderVendorList(content, type){
  const isSupplier     = type === 'supplier';
  const label          = isSupplier ? 'Suppliers' : 'Companies';
  const labelSingular  = isSupplier ? 'Supplier' : 'Company';
  const subtitle       = isSupplier ? 'Other distributors you buy from' : 'Manufacturers & companies you stock';
  const icon           = isSupplier ? '🚚' : '🏢';
  const list           = DB.suppliers.filter(s => (s.type || 'company') === type);

  content.innerHTML = `
    <div class="page-head">
      <div><h1>${label}</h1><p>${list.length} ${labelSingular.toLowerCase()}${list.length === 1 ? '' : 's'} · ${subtitle}</p></div>
      <div class="page-actions">
        <button class="btn btn-primary btn-sm" id="add-vendor">+ Add ${labelSingular}</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:200px">
        <label class="label">Search</label>
        <input class="input" id="v-search" placeholder="Name, firm or phone...">
      </div>
      <div style="flex:1;min-width:140px">
        <label class="label">Sort</label>
        <select class="input" id="v-sort">
          <option value="name">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
          <option value="due-desc">Payable (high first)</option>
          <option value="due">Payable (low first)</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <label class="label">&nbsp;</label>
        <select class="input" id="v-filter">
          <option value="">All</option>
          <option value="due">Only with payable</option>
          <option value="nodue">Only cleared</option>
        </select>
      </div>
    </div>

    <div id="v-list"></div>
  `;

  function filtered(){
    const q      = ($('#v-search').value || '').toLowerCase().trim();
    const sortBy = $('#v-sort').value;
    const flt    = $('#v-filter').value;

    let arr = list
      .map(s => ({ ...s, _tt: supplierTotals(s.id) }))
      .filter(s => {
        if(q && !((s.name || '').toLowerCase().includes(q)
              || (s.shop_name || '').toLowerCase().includes(q)
              || (s.phone || '').includes(q))) return false;
        if(flt === 'due'   && !(s._tt.total_due > 0)) return false;
        if(flt === 'nodue' && s._tt.total_due > 0) return false;
        return true;
      });

    if(sortBy === 'name')           arr.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    else if(sortBy === 'name-desc') arr.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
    else if(sortBy === 'due-desc')  arr.sort((a, b) => b._tt.total_due - a._tt.total_due);
    else if(sortBy === 'due')       arr.sort((a, b) => a._tt.total_due - b._tt.total_due);
    return arr;
  }

  function renderList(){
    const arr = filtered();
    const box = $('#v-list');

    if(arr.length === 0){
      box.innerHTML = list.length === 0
        ? `<div class="card"><div class="empty">
             <div class="empty-icon">${icon}</div>
             <h3>No ${label.toLowerCase()} yet</h3>
             <p>${isSupplier
               ? 'Add other distributors or wholesalers you buy from.'
               : 'Add the manufacturers or companies you stock.'}</p>
             <button class="btn btn-primary" id="add-vendor-empty">+ Add your first ${labelSingular.toLowerCase()}</button>
           </div></div>`
        : `<div class="card"><div class="empty">
             <div class="empty-icon">🔍</div>
             <h3>No ${label.toLowerCase()} match your filter</h3>
           </div></div>`;
      const eb = $('#add-vendor-empty');
      if(eb) eb.onclick = () => openSupplierForm(null, type);
      return;
    }

    box.innerHTML = arr.map(s => {
      const tt   = s._tt;
      const init = (s.name || 'V').charAt(0).toUpperCase();
      const typeChip = isSupplier
        ? '<span class="chip chip-blue" style="font-size:9px">SUPPLIER</span>'
        : '<span class="chip chip-teal" style="font-size:9px">COMPANY</span>';

      return `
        <a href="#/${isSupplier ? 'supplier' : 'company'}/${s.id}" class="card" style="display:block;margin-bottom:10px;text-decoration:none;color:inherit;cursor:pointer">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px">
            <div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1">
              <div class="list-avatar" style="width:44px;height:44px;font-size:16px;background:${isSupplier ? 'var(--blue-50)' : 'var(--teal-50)'};color:${isSupplier ? 'var(--blue-700)' : 'var(--teal-700)'}">${esc(init)}</div>
              <div style="min-width:0;flex:1">
                <div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
                ${s.shop_name ? `<div class="text-xs muted" style="margin-top:2px">${esc(s.shop_name)}</div>` : ''}
                <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:4px">
                  ${s.phone ? `<span>📞 ${esc(s.phone)}</span>` : ''}
                  ${s.category ? `<span class="chip chip-gray">${esc(s.category)}</span>` : ''}
                </div>
              </div>
            </div>
            ${typeChip}
          </div>
          <div class="grid-3">
            <div class="mini-stat"><div class="lbl">Purchased</div><div class="val">${rs(tt.total_purchase)}</div></div>
            <div class="mini-stat"><div class="lbl">Paid</div><div class="val" style="color:var(--green)">${rs(tt.total_paid)}</div></div>
            <div class="mini-stat" style="background:${tt.total_due > 0 ? '#fef2f2' : '#f8fafc'};border-color:${tt.total_due > 0 ? '#fecaca' : 'var(--border)'}">
              <div class="lbl">Payable</div>
              <div class="val" style="color:${tt.total_due > 0 ? 'var(--red)' : 'var(--text-2)'}">${rs(tt.total_due)}</div>
            </div>
          </div>
        </a>`;
    }).join('');
  }

  ['v-search', 'v-sort', 'v-filter'].forEach(id => {
    const el = $('#' + id);
    if(el){ el.oninput = renderList; el.onchange = renderList; }
  });

  renderList();
  $('#add-vendor').onclick = () => openSupplierForm(null, type);
}

    .filter(b => b.supplier_id === id)
    .sort((a, b) => txDate(b, 'bill_date').localeCompare(txDate(a, 'bill_date')));

    <div class="page-actions" style="margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" id="btn-edit-s">✎ Edit</button>
      <button class="btn btn-ghost btn-sm" id="btn-pay-s">+ Payment</button>
      ${s.phone ? `<button class="btn btn-ghost btn-sm" id="btn-wa-s">💬 WhatsApp</button>` : ''}
      <button class="btn btn-primary btn-sm" id="btn-buy">+ Purchase Bill</button>
    </div>

    <div class="grid-4" style="margin-bottom:16px">
      <div class="mini-stat"><div class="lbl">Total Purchase</div><div class="val">${rs(tt.total_purchase)}</div></div>
      <div class="mini-stat"><div class="lbl">Total Paid</div><div class="val" style="color:var(--green)">${rs(tt.total_paid)}</div></div>
      <div class="mini-stat" style="background:${tt.total_due > 0 ? '#fef2f2' : '#f8fafc'};border-color:${tt.total_due > 0 ? '#fecaca' : 'var(--border)'}">
        <div class="lbl">Payable</div>
        <div class="val" style="color:${tt.total_due > 0 ? 'var(--red)' : 'var(--text)'}">${rs(tt.total_due)}</div>
      </div>
      <div class="mini-stat"><div class="lbl">Opening</div><div class="val">${rs(tt.opening)}</div></div>
    </div>

    ${s.address || s.gst ? `
      <div class="card" style="margin-bottom:16px">
        <div class="text-xs muted" style="text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-bottom:6px">Details</div>
        ${s.address ? `<div class="text-sm" style="margin-bottom:4px">📍 ${esc(s.address)}</div>` : ''}
        ${s.gst     ? `<div class="text-sm muted">GSTIN: <span class="mono">${esc(s.gst)}</span></div>` : ''}

    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Purchase Bills <small>${bills.length}</small></div>
        ${!bills.length
          ? '<p class="text-sm muted-2 text-center" style="padding:20px 0">No bills yet</p>'
          : `<div>${bills.slice(0, 10).map(b => {
              const bal = Number(b.total || 0) - Number(b.paid || 0);
              return `
                <div style="display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center">
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600">${esc(b.bill_no || '—')}</div>
                    <div class="text-xs muted">${txDT(b, 'bill_date')}</div>
                  </div>
                  <div style="text-align:right;white-space:nowrap">
                    <div style="font-weight:600">${rs(b.total)}</div>
                    <div class="text-xs" style="color:${bal > 0 ? 'var(--red)' : 'var(--green)'}">
                      ${bal > 0 ? 'Due ' + rs(bal) : 'Paid'}
                    </div>
                  </div>
                  <button class="btn btn-ghost btn-sm" data-bill-del="${b.id}" style="color:var(--red)">Del</button>
                </div>`;
            }).join('')}</div>`}
      </div>

      <div class="card">
        <div class="card-title">Payments <small>${pays.length}</small></div>
        ${!pays.length
          ? '<p class="text-sm muted-2 text-center" style="padding:20px 0">No payments yet</p>'
          : `<div>${pays.slice(0, 10).map(p => `
              <div style="display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center">
                <div style="flex:1;min-width:0">
                  <div style="color:var(--green);font-weight:600">
                    ${rs(p.amount)}
                    <span class="text-xs muted" style="font-weight:400">— ${esc(p.mode || '')}</span>
                  </div>
                  <div class="text-xs muted">${txDT(p, 'payment_date')}</div>
                </div>
                <button class="btn btn-ghost btn-sm" data-spay-del="${p.id}" style="color:var(--red)">Del</button>
              </div>`).join('')}</div>`}
      </div>
    </div>

    ${returnsTo.length ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">Returns to this ${typeLabel} <small>${returnsTo.length}</small></div>
        <div class="tbl-wrap responsive">
          <table>
            <thead><tr>
              <th>Date</th><th>Product</th><th>Batch</th><th>Qty</th>
              <th style="text-align:right">Amount</th><th>Reason</th>
            </tr></thead>
            <tbody>
              ${returnsTo.map(r => `<tr>
                <td>${txDT(r, 'return_date')}</td>
                <td>${esc(r.product_name || '—')}</td>
                <td><span class="batch-pill">${esc(r.batch_no || '—')}</span></td>
                <td>${fmtNum(r.qty)} ${esc(r.unit || '')}</td>
                <td style="text-align:right;color:var(--red)">${rs(r.amount)}</td>
                <td class="text-sm muted">${esc(r.reason || '—')}</td>
              </tr>`).join('')}

      <div class="card-title">Ledger <small>Running balance</small></div>

                const tl = [

          ...bills.filter(b => Number(b.paid) > 0).map(b => ({ date: txDate(b, 'bill_date'), type: 'Bill Payment', ref: b.bill_no + ' (Paid)', id: b.id, debit: Number(b.paid), credit: 0 })),
          // 3. Extra Payments (Debits)
          ...pays.map(p => ({ date: txDate(p, 'payment_date'), type: 'Payment', ref: p.mode || 'Payment', id: p.id, debit: Number(p.amount || 0), credit: 0 })),
          // 4. Returns (Debits)
          ...returnsTo.map(r => ({ date: txDate(r, 'return_date'), type: 'Return', ref: r.product_name || 'Return', id: r.id, debit: Number(r.amount || 0), credit: 0 }))
        ].sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          if (a.credit > 0 && b.debit > 0) return -1;
          if (a.debit > 0 && b.credit > 0) return 1;
          return 0;
        });
        let bal = tt.opening;

        const rowsHTML = [];

        if(tt.opening !== 0){
          rowsHTML.push(`<tr>
            <td>—</td>

            <td style="text-align:right">${tt.opening > 0 ? '—' : rs(-tt.opening)}</td>
            <td style="text-align:right;color:var(--green)">${tt.opening > 0 ? rs(tt.opening) : '—'}</td>
            <td style="text-align:right;font-weight:700;color:${bal > 0 ? 'var(--red)' : 'var(--green)'}">${rs(Math.abs(bal))}</td>
          </tr>`);
        }

        if(!tl.length){
          rowsHTML.push(`<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-2)">No transactions yet</td></tr>`);
        } else {
          tl.forEach(x => {
            bal += x.credit - x.debit;
            rowsHTML.push(`<tr>
              <td>${fmtDate(x.date)}</td>
              <td>${esc(x.ref || '')}</td>
              <td style="text-align:right;color:var(--green)">${x.debit ? rs(x.debit) : '—'}</td>
              <td style="text-align:right">${x.credit ? rs(x.credit) : '—'}</td>
              <td style="text-align:right;font-weight:700;color:${bal > 0 ? 'var(--red)' : 'var(--green)'}">${rs(Math.abs(bal))}</td>
            </tr>`);
          });
        }

        return `<div class="tbl-wrap responsive"><table>
          <thead><tr>
            <th>Date</th><th>Reference</th>
            <th style="text-align:right">Paid</th>
            <th style="text-align:right">Billed</th>
            <th style="text-align:right">Balance</th>
          </tr></thead>
          <tbody>${rowsHTML.join('')}</tbody>
        </table></div>`;
      })()}
    </div>

    <div class="text-center text-xs muted-2" style="padding:14px 0">${enteredOn(s)}</div>
  `;

  /* ── Wire ── */
  $('#btn-edit-s').onclick = () => openSupplierForm(s);
  $('#btn-pay-s').onclick  = () => openSupplierPaymentForm(s);
  $('#btn-buy').onclick    = () => openPurchaseBillForm(s);

  const waBtn = $('#btn-wa-s');
  if(waBtn && s.phone){
    waBtn.onclick = () => {
      let msg = '';
      msg += '*' + (SETTINGS.shop_name || 'MediStore') + '*\n';
      if(SETTINGS.phone) msg += 'Ph: ' + SETTINGS.phone + '\n';
      msg += '\nHello ' + (s.name || '') + ',\n\n';
      msg += 'Account summary with us:\n';
      msg += '• Total purchase: ' + rs(tt.total_purchase) + '\n';
      msg += '• Total paid: ' + rs(tt.total_paid) + '\n';
      msg += '*• Payable: ' + rs(tt.total_due) + '*\n';
      if(bills[0]) msg += '\nLast bill: ' + (bills[0].bill_no || '—') + ' on ' + fmtDate(txDate(bills[0], 'bill_date')) + '\n';
      msg += '\n— ' + (SETTINGS.shop_name || 'MediStore');
      window.open(waLink(s.phone, msg), '_blank');
    };
  }

  /* ── Delete purchase bill (reverses batch stock) ── */
  $$('[data-bill-del]').forEach(b => b.onclick = async () => {
    const bill = DB.supplier_invoices.find(x => x.id === b.dataset.billDel);
    if(!bill) return;
    if(!confirmDlg('Delete bill "' + (bill.bill_no || '—') + '"?\n\nBatches added by this bill will be removed. If any batch has already been sold from, deletion will be blocked.', 'Confirm Delete')) return;

    const items = DB.supplier_invoice_items.filter(x => x.supplier_invoice_id === bill.id);

    /* Pre-check: any batch that has been sold from? (qty < original) */
    for(const it of items){
      if(!it.batch_no || !it.expiry_date) continue;
      const batch = DB.product_batches.find(b =>
        b.product_id === it.product_id &&
        b.batch_no === it.batch_no &&
        b.expiry_date === it.expiry_date
      );
      if(batch && Number(batch.qty) < Number(it.qty)){
        toast('Cannot delete: batch ' + it.batch_no + ' has already been sold from', 'error');
        return;
      }
    }

    /* Reverse batch qty (subtract what this bill added) */
    for(const it of items){
      if(!it.batch_no || !it.expiry_date) continue;
      const batch = DB.product_batches.find(b =>
        b.product_id === it.product_id &&
        b.batch_no === it.batch_no &&
        b.expiry_date === it.expiry_date
      );
      if(batch){
        await adjustBatchQty(batch.id, -Number(it.qty));
      }
    }

    const { error } = await sb.from('supplier_invoices').delete().eq('id', bill.id);
    if(error){ toast(error.message, 'error'); return; }

    await syncDB();
    toast('Bill deleted · batch stock reversed', 'success');
    route();
  });

  /* ── Delete supplier payment ── */
  $$('[data-spay-del]').forEach(b => b.onclick = async () => {
    if(!confirmDlg('Delete this payment?', 'Confirm Delete')) return;
    const { error } = await sb.from('supplier_payments').delete().eq('id', b.dataset.spayDel);
    if(error){ toast(error.message, 'error'); return; }
    await syncDB();
    toast('Payment deleted', 'success');
    route();
  });
}

   ───────────────────────────────────────────── */
function openSupplierPaymentForm(s){
  if(!s){ toast('Supplier not found', 'error'); return; }

  openModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:6px">Pay to ${esc(s.type === 'supplier' ? 'Supplier' : 'Company')}</h2>
    <div class="text-sm muted" style="margin-bottom:14px">To: <b style="color:var(--text)">${esc(s.name)}</b></div>
    <form id="spf" style="display:flex;flex-direction:column;gap:12px">
      ${dateTimeFieldHTML(null, '', 'Payment Date')}
      <div><label class="label">Amount (₹) *</label>
        <input class="input" type="number" step="any" min="0.01" name="amount" required autofocus></div>
      <div><label class="label">Mode</label>
        <select class="input" name="mode">
          <option>cash</option>
          <option>upi</option>
          <option>bank</option>
          <option>cheque</option>
          <option>neft</option>
        </select>
      </div>
      <div><label class="label">Notes</label>
        <input class="input" name="notes" placeholder="Optional reference, cheque no, etc."></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="spf-save">Save</button>
      </div>
    </form>
  `, root => {
    root.querySelector('#spf').onsubmit = async e => {
      e.preventDefault();
      const dt = readDateTime(e.target);
      if(!dt) return;
      const fd  = new FormData(e.target);
      const amt = Number(fd.get('amount')) || 0;
      if(amt <= 0){ toast('Amount must be greater than 0', 'error'); return; }

      const btn = root.querySelector('#spf-save');
      btn.disabled = true; btn.textContent = 'Saving...';

      const { error } = await sb.from('supplier_payments').insert({
        supplier_id:   s.id,
        supplier_name: s.name || '',
        amount:        amt,
        mode:          fd.get('mode'),
        notes:         (fd.get('notes') || '').trim(),
        payment_date:  dt.date,
        tx_time:       dt.time
      });

      if(error){
        toast(error.message, 'error');
        btn.disabled = false; btn.textContent = 'Save';
        return;
      }
      await syncDB();
      toast('Payment saved', 'success');
      closeModal(root);
      route();
    };
  });
}
